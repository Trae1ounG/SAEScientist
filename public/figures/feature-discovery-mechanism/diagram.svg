<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1180 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .frame { fill: #fbf8f2; stroke: #aa8f7d; stroke-width: 1.3; }
    .expert { fill: #f8f2ea; stroke: #9b705b; stroke-width: 1.2; }
    .agent { fill: #f8f2ea; stroke: #9b705b; stroke-width: 1.2; }
    .eval { fill: #eff7ed; stroke: #609054; stroke-width: 1.2; }
    .result { fill: #fff8dd; stroke: #b18b26; stroke-width: 1.2; }
    .reject { fill: #fff0ea; stroke: #c96f52; stroke-width: 1.2; }
    .paper { fill: #fff; stroke: #a88b79; stroke-width: 1; }
    .divider { stroke: #ddcec2; stroke-width: 1; }
    .green-divider { stroke: #c7dec1; stroke-width: 1; }
    .arrow { fill: none; stroke: #555; stroke-width: 1.7; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #d36a3b; stroke-width: 1.8; marker-end: url(#orange-arrow); }
    .h0 { fill: #513d33; font-size: 21px; font-weight: 750; }
    .h1 { fill: #513d33; font-size: 15px; font-weight: 700; }
    .h2 { fill: #2f2f2f; font-size: 13px; font-weight: 700; }
    .body { fill: #625c57; font-size: 11px; }
    .tiny { fill: #8a817b; font-size: 9px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .band { fill: #7d5d4c; font-size: 11px; font-weight: 700; letter-spacing: 1.1px; }
    .green { fill: #47763d; }
    .gold { fill: #876711; }
    .orange { fill: #a94e2d; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d36a3b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="h0 mono" x="24" y="31">SAEScientist-Bench system overview</text>
  <text class="body" x="24" y="50">Expert task construction and scored agent evaluation are separated by a frozen benchmark boundary.</text>

  <text class="band mono" x="24" y="83">A · EXPERT TASK CONSTRUCTION</text>

  <rect class="expert" x="24" y="98" width="205" height="174" rx="11"/>
  <text class="h1 mono" x="45" y="126">Official SAE anchor</text>
  <g transform="translate(47 145)">
    <rect class="paper" x="0" y="0" width="46" height="54" rx="6"/>
    <rect x="9" y="9" width="7" height="36" rx="2" fill="#c7d8ee"/>
    <rect x="20" y="9" width="7" height="36" rx="2" fill="#7fa8d8"/>
    <rect x="31" y="9" width="7" height="36" rx="2" fill="#286ee0"/>
  </g>
  <text class="h2" x="105" y="159">Gemma Scope</text>
  <text class="body" x="105" y="177">Gemma 2 9B</text>
  <text class="body" x="105" y="194">resid_post · L9 / L20</text>
  <text class="body" x="105" y="211">width 131,072</text>
  <line class="divider" x1="45" y1="224" x2="208" y2="224"/>
  <text class="body" x="45" y="245">Known expert Feature ID</text>
  <text class="h2 mono" x="45" y="263">k*</text>

  <line class="arrow" x1="229" y1="185" x2="265" y2="185"/>

  <rect class="expert" x="269" y="98" width="225" height="174" rx="11"/>
  <text class="h1 mono" x="290" y="126">Case construction</text>
  <rect class="paper" x="291" y="144" width="181" height="94" rx="7"/>
  <circle cx="309" cy="163" r="7" fill="#5d9a51"/><text x="309" y="167" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">+</text>
  <text class="h2" x="326" y="168">Positive cases</text>
  <circle cx="309" cy="190" r="7" fill="#d58b31"/><text x="309" y="194" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">±</text>
  <text class="h2" x="326" y="195">Hard negatives</text>
  <circle cx="309" cy="217" r="7" fill="#9c9c9c"/><text x="309" y="221" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">○</text>
  <text class="h2" x="326" y="222">Neutral controls</text>

  <line class="arrow" x1="494" y1="185" x2="530" y2="185"/>

  <rect class="expert" x="534" y="98" width="250" height="174" rx="11"/>
  <text class="h1 mono" x="555" y="126">Expert admission tests</text>
  <text class="h2" x="555" y="155">Activation separation</text>
  <line x1="555" y1="164" x2="750" y2="164" stroke="#ddd"/>
  <circle cx="580" cy="181" r="5" fill="#286ee0"/><circle cx="607" cy="181" r="5" fill="#286ee0"/><circle cx="635" cy="181" r="5" fill="#286ee0"/>
  <circle cx="690" cy="181" r="5" fill="#d58b31"/><circle cx="713" cy="181" r="5" fill="#d58b31"/>
  <text class="tiny" x="555" y="205">AUROC · margin · active rate</text>
  <text class="h2" x="555" y="229">Causal validation</text>
  <text class="body" x="555" y="247">expert vs matched-random steering</text>
  <text class="body" x="555" y="262">blinded PE judge</text>

  <line class="arrow" x1="784" y1="185" x2="820" y2="185"/>

  <rect class="eval" x="824" y="98" width="332" height="174" rx="11"/>
  <text class="h1 mono green" x="846" y="126">Frozen benchmark task</text>
  <rect class="paper" x="846" y="143" width="289" height="108" rx="7"/>
  <text class="h2" x="864" y="164">Visible to agent</text>
  <text class="body" x="864" y="181">English research target</text>
  <line class="green-divider" x1="864" y1="192" x2="1117" y2="192"/>
  <text class="h2" x="864" y="211">Hidden evaluation package</text>
  <text class="body" x="864" y="227">expert ID · held-out cases</text>
  <text class="body" x="864" y="243">steering prompts · judge inputs</text>

  <line x1="990" y1="272" x2="990" y2="313" stroke="#555" stroke-width="1.7"/>
  <path class="arrow" d="M990 313 L177 313 L177 349"/>
  <text class="tiny mono" x="708" y="303">sample one frozen task</text>

  <text class="band mono" x="24" y="335">B · SCORED AGENT EPISODE</text>
  <rect class="agent" x="24" y="350" width="306" height="205" rx="11"/>
  <text class="h1 mono" x="45" y="380">Agent feature investigation</text>
  <text class="h2" x="46" y="409">Inputs and resources</text>
  <rect class="paper" x="46" y="423" width="44" height="44" rx="6"/>
  <text class="h2 mono" x="68" y="450" text-anchor="middle">T</text>
  <text class="h2" x="103" y="438">Target description</text>
  <text class="tiny" x="103" y="454">no feature ID or hidden cases</text>
  <rect class="paper" x="46" y="479" width="44" height="44" rx="6"/>
  <text class="h2 mono" x="68" y="506" text-anchor="middle">&gt;_</text>
  <text class="h2" x="103" y="494">Probe API + workspace</text>
  <text class="tiny" x="103" y="510">agent-written probes and analysis code</text>

  <path class="feedback" d="M68 523 L68 580 L14 580 L14 501 L42 501"/>
  <text class="tiny mono orange" x="89" y="580">revise probes and hypothesis</text>

  <line class="arrow" x1="330" y1="453" x2="370" y2="453"/>

  <rect class="expert" x="374" y="385" width="177" height="139" rx="10"/>
  <text class="tiny" x="395" y="410">AGENT CLAIM</text>
  <text class="h1 mono" x="395" y="439">Feature #k</text>
  <line class="divider" x1="395" y1="451" x2="530" y2="451"/>
  <text class="body" x="395" y="473">one ID</text>
  <text class="body" x="395" y="492">activation evidence</text>
  <text class="body" x="395" y="511">interpretation</text>

  <line class="arrow" x1="551" y1="453" x2="583" y2="453"/>
  <path class="agent" d="M633 391 L695 453 L633 515 L571 453 Z"/>
  <text class="h2" x="633" y="442" text-anchor="middle">Trace + schema</text>
  <text class="h2" x="633" y="460" text-anchor="middle">audit</text>
  <text class="tiny" x="633" y="479" text-anchor="middle">one valid ID</text>
  <path class="feedback" d="M633 391 L633 382"/>
  <rect class="reject" x="577" y="331" width="112" height="47" rx="7"/>
  <text class="h2 orange" x="633" y="351" text-anchor="middle">Invalid run</text>
  <text class="tiny" x="633" y="366" text-anchor="middle">audit failure recorded</text>

  <line class="arrow" x1="695" y1="453" x2="729" y2="453"/>
  <rect class="eval" x="733" y="350" width="278" height="205" rx="11"/>
  <text class="h1 mono green" x="755" y="380">Trusted evaluator</text>
  <text class="body" x="755" y="402">Official SAE · hidden task package</text>
  <line class="green-divider" x1="755" y1="416" x2="989" y2="416"/>
  <text class="h2" x="755" y="440">1  Localization</text>
  <text class="tiny" x="774" y="455">exact ID · expert rank</text>
  <text class="h2" x="755" y="479">2  Interpretation</text>
  <text class="tiny" x="774" y="494">held-out activation profile</text>
  <text class="h2" x="755" y="518">3  Intervention</text>
  <text class="tiny" x="774" y="533">expert · candidate · random steering · PE judge</text>

  <line class="arrow" x1="1011" y1="453" x2="1038" y2="453"/>
  <rect class="result" x="1042" y="374" width="114" height="159" rx="9"/>
  <text class="h1 mono gold" x="1099" y="404" text-anchor="middle">Scorecard</text>
  <line x1="1060" y1="418" x2="1138" y2="418" stroke="#ddca83"/>
  <text class="h2" x="1099" y="442" text-anchor="middle">Exact</text>
  <text class="h2" x="1099" y="464" text-anchor="middle">Activation</text>
  <text class="h2" x="1099" y="486" text-anchor="middle">Causal</text>
  <text class="h2" x="1099" y="508" text-anchor="middle">Usable</text>

  <rect class="frame" x="24" y="603" width="1132" height="27" rx="5"/>
  <text class="h2 mono" x="43" y="622">Frozen rules</text>
  <text class="tiny" x="163" y="622">official SAE · fixed model/layer · no web or label search · hidden expert task package · matched-random control</text>
</svg>
