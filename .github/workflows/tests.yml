name: Source and CPU tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy transformers matplotlib
          python -m pip install --no-deps -e .
      - name: Check source release
        run: python scripts/check_source_release.py
      - name: Validate benchmark inputs
        run: python scripts/inspect_dataset.py
      - name: Validate the full experiment plan
        run: python scripts/run_benchmark.py --config configs/benchmark.json --dry-run
      - name: Run tests without weights or credentials
        run: python -m pytest -q
