[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sae-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.30",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "openai>=1.0",
  "ray[default]>=2.40",
  "safetensors>=0.4",
  "torch>=2.5",
  "transformers>=4.51",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sae-bench = "sae_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
