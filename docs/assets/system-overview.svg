<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .panel { fill: #fafafa; stroke: #b9b9b9; stroke-width: 1.2; }
    .candidate { fill: #fff7f2; stroke: #d4572a; stroke-width: 1.2; }
    .evaluator { fill: #f4f8ff; stroke: #286ee0; stroke-width: 1.2; }
    .score { fill: #fffbea; stroke: #a98520; stroke-width: 1.2; }
    .invalid { fill: #fff2ee; stroke: #d4572a; stroke-width: 1.2; }
    .icon { fill: #fff; stroke: #888; stroke-width: 1; }
    .line { fill: none; stroke: #555; stroke-width: 1.6; marker-end: url(#arrow); }
    .feedback { fill: none; stroke: #d4572a; stroke-width: 1.6; marker-end: url(#orange-arrow); }
    .h1 { fill: #1e1e1e; font-size: 18px; font-weight: 700; }
    .h2 { fill: #1e1e1e; font-size: 14px; font-weight: 650; }
    .body { fill: #555; font-size: 12px; }
    .small { fill: #777; font-size: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { fill: #777; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .rule { stroke: #e1e1e1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#d4572a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="panel" x="20" y="54" width="282" height="282" rx="12"/>
  <text class="h1 mono" x="40" y="84">Agent conducts feature research</text>
  <text class="h2" x="42" y="116">Inputs</text>
  <rect class="icon" x="42" y="130" width="44" height="44" rx="6"/>
  <text class="h2 mono" x="64" y="157" text-anchor="middle">T</text>
  <text class="h2" x="98" y="146">Semantic target</text>
  <text class="small" x="98" y="163">English description only</text>
  <rect class="icon" x="42" y="186" width="44" height="44" rx="6"/>
  <text class="h2 mono" x="64" y="213" text-anchor="middle">&gt;_</text>
  <text class="h2" x="98" y="202">Restricted probe API</text>
  <text class="small" x="98" y="219">activation values + feature ranks</text>
  <line class="rule" x1="42" y1="246" x2="280" y2="246"/>
  <text class="h2" x="42" y="270">Agent-controlled workspace</text>
  <text class="body" x="42" y="291">probe cases · analysis code · notes</text>
  <text class="small" x="42" y="315">internet off · benchmark repository hidden</text>

  <path class="feedback" d="M64 230 L64 350 L20 350 L20 208 L38 208"/>
  <text class="label" x="80" y="366">probe feedback supports iterative hypothesis revision</text>

  <rect class="candidate" x="348" y="113" width="174" height="156" rx="10"/>
  <text class="small" x="370" y="138">AGENT SUBMISSION</text>
  <text class="h1 mono" x="370" y="168">Feature #k</text>
  <line x1="370" y1="183" x2="500" y2="183" stroke="#efc1ad"/>
  <text class="body" x="370" y="207">one feature ID</text>
  <text class="body" x="370" y="227">activation evidence</text>
  <text class="body" x="370" y="247">semantic interpretation</text>
  <line class="line" x1="302" y1="191" x2="344" y2="191"/>
  <text class="label" x="307" y="180">submit once</text>

  <path class="panel" d="M587 126 L650 191 L587 256 L524 191 Z"/>
  <text class="h2" x="587" y="174" text-anchor="middle">Submission</text>
  <text class="h2" x="587" y="193" text-anchor="middle">audit</text>
  <text class="small" x="587" y="214" text-anchor="middle">one ID · valid schema</text>
  <text class="small" x="587" y="230" text-anchor="middle">clean trace</text>
  <line class="line" x1="522" y1="191" x2="524" y2="191"/>

  <rect class="invalid" x="530" y="20" width="114" height="62" rx="8"/>
  <text class="h2" x="587" y="46" text-anchor="middle">Invalid run</text>
  <text class="small" x="587" y="64" text-anchor="middle">audit failure recorded</text>
  <path class="feedback" d="M587 126 L587 85"/>
  <text class="label" x="596" y="105">violation</text>

  <rect class="evaluator" x="690" y="84" width="228" height="214" rx="12"/>
  <text class="h1 mono" x="712" y="116">Trusted evaluator</text>
  <text class="body" x="712" y="140">Official Gemma Scope SAE</text>
  <text class="body" x="712" y="158">hidden expert ID + frozen cases</text>
  <line x1="712" y1="176" x2="896" y2="176" stroke="#bfd1ef"/>
  <text class="h2" x="712" y="200">1  Localization</text>
  <text class="small" x="730" y="218">exact ID · expert rank</text>
  <text class="h2" x="712" y="242">2  Interpretation</text>
  <text class="small" x="730" y="260">held-out activation profile</text>
  <text class="h2" x="712" y="284">3  Intervention</text>
  <text class="small" x="730" y="302">expert · candidate · random steering</text>
  <line class="line" x1="650" y1="191" x2="686" y2="191"/>
  <text class="label" x="654" y="180">valid</text>

  <rect class="score" x="958" y="105" width="104" height="172" rx="10"/>
  <text class="h2 mono" x="1010" y="133" text-anchor="middle">Scorecard</text>
  <line x1="974" y1="148" x2="1046" y2="148" stroke="#dfcf91"/>
  <text class="body" x="1010" y="174" text-anchor="middle">Exact</text>
  <text class="body" x="1010" y="196" text-anchor="middle">Activation</text>
  <text class="body" x="1010" y="218" text-anchor="middle">Causal</text>
  <text class="body" x="1010" y="240" text-anchor="middle">Usable</text>
  <text class="small" x="1010" y="260" text-anchor="middle">reported separately</text>
  <line class="line" x1="918" y1="191" x2="954" y2="191"/>

  <rect class="panel" x="20" y="402" width="1042" height="46" rx="7"/>
  <text class="h2 mono" x="42" y="430">Frozen protocol</text>
  <text class="body" x="170" y="430">official SAE · fixed layer and width · hidden prompts · no label search · matched-random control · blinded PE judge</text>
</svg>

